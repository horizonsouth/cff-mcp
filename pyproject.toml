[project]
name = "cff-mcp"
version = "0.1.0"
description = "Set up a project so an AI assistant stops guessing"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
cff-mcp = "cff.server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cff"]

[dependency-groups]
dev = ["pytest>=8.0"]
